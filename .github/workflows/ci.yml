name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # format, lint, typecheck, and every test — the same command used locally.
      - run: pnpm verify

  reference-calculation:
    name: Reference calculation (Figure 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Split out so a failure here is unmistakable: the brief says these five numbers are the
      # first thing checked, and everything else is meaningless if they are wrong.
      - run: pnpm --filter @repo/acceptance test

  docker:
    name: docker compose up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: The suite answers on :8080
        run: |
          set -euo pipefail
          for path in / /config.json /remotes/people/mf-manifest.json \
                      /remotes/delivery/mf-manifest.json /api/people/snapshot /api/delivery/snapshot; do
            code=$(curl -so /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: A missing remote entry really 404s, so fault injection is real
        run: |
          code=$(curl -so /dev/null -w '%{http_code}' \
            http://localhost:8080/remotes/people/__fault-injected__/mf-manifest.json)
          echo "fault entry -> $code"
          [ "$code" = "404" ]

      - name: No remote URL is baked into the shell bundle
        run: |
          set -uo pipefail
          # BusyBox grep (nginx:alpine) has no --include, and a failing grep inside `if` would
          # make this check silently pass. List every match, then filter on the host.
          matches=$(docker compose exec -T shell \
            sh -c 'grep -rl "remotes/people" /usr/share/nginx/html' | tr -d '\r')
          echo "files carrying a remote URL:"; echo "$matches"
          offenders=$(echo "$matches" | grep '\.js$' || true)
          if [ -n "$offenders" ]; then
            echo "A remote URL is baked into a bundled .js file:"; echo "$offenders"; exit 1
          fi
          echo "clean: the only file carrying one is config.json"

      - name: Rebuilding one service does not 502 the gateway
        run: |
          set -euo pipefail
          # nginx caches an upstream resolved directly in proxy_pass for the life of the process.
          # Recreating a backend gives it a new IP and the gateway would 502 for ever; the gateway
          # config names upstreams through a variable so they are re-resolved instead.
          docker compose up -d --force-recreate people-api delivery-api
          sleep 15
          for path in /api/people/snapshot /api/delivery/snapshot; do
            code=$(curl -so /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "after recreate: $path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - if: always()
        run: docker compose logs --no-color | tail -100

      - if: always()
        run: docker compose down -v
