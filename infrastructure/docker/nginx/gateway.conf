# The single origin the browser talks to.
#
# Everything is behind one host and port, which is why the frontends use relative API paths and why
# the running stack needs no CORS at all. (The dev servers do send a permissive header, because
# there the shell and the remotes are on different ports.) It is also what makes the entry URLs
# meaningful:
# they are absolute URLs on this gateway, handed to the shell at runtime in config.json.

server {
    listen 8080;
    server_name _;

    # --- the two domain services, each owned by a different team -------------
    location /api/people/ {
        proxy_pass http://people-api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/delivery/ {
        proxy_pass http://delivery-api:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- the two remotes, independently deployable ---------------------------
    # Browsing these directly runs the remote standalone, from the same build the shell loads.
    location = /remotes/people {
        return 301 /remotes/people/;
    }

    location /remotes/people/ {
        proxy_pass http://people:80/;
        proxy_set_header Host $host;
    }

    location = /remotes/delivery {
        return 301 /remotes/delivery/;
    }

    location /remotes/delivery/ {
        proxy_pass http://delivery:80/;
        proxy_set_header Host $host;
    }

    # --- the host ------------------------------------------------------------
    location / {
        proxy_pass http://shell:80/;
        proxy_set_header Host $host;
    }
}
