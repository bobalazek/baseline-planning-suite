# The single origin the browser talks to.
#
# Everything is behind one host and port, which is why the frontends use relative API paths and why
# the running stack needs no CORS at all. (The dev servers do send a permissive header, because
# there the shell and the remotes are on different ports.) It is also what makes the entry URLs
# meaningful: they are absolute URLs on this gateway, handed to the shell at runtime in config.json.

server {
    listen 8080;
    server_name _;

    # Docker's embedded DNS, re-resolved on a short TTL.
    #
    # nginx resolves an upstream name written directly into `proxy_pass` exactly once, at start-up,
    # and caches the address for the life of the process. Rebuild any backend — `docker compose up
    # --build` recreates it with a new IP but leaves this container alone, because its own image and
    # config did not change — and the gateway 502s until it is manually restarted. Naming the
    # upstream through a variable forces re-resolution instead, which is what makes a rebuild of one
    # service actually safe.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- the two domain services, each owned by a different team -------------
    location /api/people/ {
        set $people_api people-api;
        rewrite ^/api/people/(.*)$ /$1 break;
        proxy_pass http://$people_api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/delivery/ {
        set $delivery_api delivery-api;
        rewrite ^/api/delivery/(.*)$ /$1 break;
        proxy_pass http://$delivery_api:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- the two remotes, independently deployable ---------------------------
    # Browsing these directly runs the remote standalone, from the same build the shell loads.
    location = /remotes/people {
        return 301 /remotes/people/;
    }

    location /remotes/people/ {
        set $people_app people;
        rewrite ^/remotes/people/(.*)$ /$1 break;
        proxy_pass http://$people_app:80;
        proxy_set_header Host $host;
    }

    location = /remotes/delivery {
        return 301 /remotes/delivery/;
    }

    location /remotes/delivery/ {
        set $delivery_app delivery;
        rewrite ^/remotes/delivery/(.*)$ /$1 break;
        proxy_pass http://$delivery_app:80;
        proxy_set_header Host $host;
    }

    # --- the host ------------------------------------------------------------
    location / {
        set $shell_app shell;
        proxy_pass http://$shell_app:80;
        proxy_set_header Host $host;
    }
}
