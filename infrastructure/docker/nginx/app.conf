server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed filenames, so assets can be cached hard. config.json never is: it is the file that
    # decides where the remotes live, and it is rewritten every time the container starts.
    location = /config.json {
        add_header Cache-Control "no-store" always;
    }

    location = /mf-manifest.json {
        add_header Cache-Control "no-store" always;
    }

    location = /remoteEntry.js {
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(js|css|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A missing manifest must be a 404, not the app's index.html. The fault-injection switch points
    # a remote entry at a URL that does not exist, and the shell should see a real load failure.
    location ~* \.json$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the app's own index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
